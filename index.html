<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edward Hacker Launcher</title>
    <style>
        body { margin: 0; padding: 0; background: black; overflow: hidden; font-family: 'Courier New', Courier, monospace; }
        canvas { display: block; }
        .content {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #00ff00; text-align: center; background: rgba(0, 0, 0, 0.9);
            padding: 20px; border: 2px solid #00ff00; box-shadow: 0 0 20px #00ff00;
            border-radius: 10px; z-index: 1; width: 85%; max-width: 400px;
        }
        .game-menu { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        button {
            background: transparent; color: #00ff00; border: 1px solid #00ff00;
            padding: 10px; font-weight: bold; cursor: pointer; font-size: 0.8em;
            transition: 0.3s; text-transform: uppercase;
        }
        button:hover { background: #00ff00; color: black; box-shadow: 0 0 10px #00ff00; }
        .scan-line { color: yellow; font-size: 0.7em; height: 20px; margin: 10px 0; }
    </style>
</head>
<body>

    <canvas id="matrix"></canvas>

    <div class="content">
        <h2 id="typewriter"></h2>
        <div id="scan-status" class="scan-line">SYSTEM READY...</div>
        
        <p style="font-size: 0.9em;">[ SELECT PROTOCOL ]</p>
        <div class="game-menu">
            <button onclick="launch('minecraft://')">MINECRAFT</button>
            <button onclick="launch('roblox://')">ROBLOX</button>
            <button onclick="launch('https://link.freefire.garena.tw')">FREE FIRE</button>
            <button onclick="startScan()">SCAN SYSTEM</button>
        </div>
        <p id="msg" style="color: red; font-size: 0.7em; margin-top: 10px;"></p>
    </div>

    <script>
        // Matrix Background
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        const letters = "01";
        const fontSize = 16; const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function draw() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#0f0"; ctx.font = fontSize + "px arial";
            drops.forEach((y, i) => {
                const text = letters.charAt(Math.floor(Math.random() * letters.length));
                ctx.fillText(text, i * fontSize, y * fontSize);
                if (y * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            });
        }
        setInterval(draw, 33);

        // Typewriter
        const text = "> EDWARD_EXECUTOR";
        let i = 0;
        function typeWriter() {
            if (i < text.length) {
                document.getElementById("typewriter").innerHTML += text.charAt(i);
                i++; setTimeout(typeWriter, 100);
            }
        }
        window.onload = typeWriter;

        // Launcher Function
        function launch(url) {
            document.getElementById("msg").innerHTML = "LAUNCHING PROTOCOL...";
            setTimeout(() => {
                window.location.href = url;
            }, 500);
        }

        function startScan() {
            let status = document.getElementById("scan-status");
            status.innerHTML = "SCANNING VULNERABILITIES...";
            status.style.color = "red";
            setTimeout(() => { 
                status.innerHTML = "SYSTEM SECURE."; 
                status.style.color = "yellow";
            }, 2000);
        }
    </script>
</body>
</html>
