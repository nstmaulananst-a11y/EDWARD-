
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edward Elite System</title>
    <style>
        body { margin: 0; padding: 0; background: black; overflow: hidden; font-family: 'Courier New', Courier, monospace; }
        canvas { display: block; }
        .content {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #00ff00; text-align: center; background: rgba(0, 0, 0, 0.8);
            padding: 30px; border: 2px solid #00ff00; box-shadow: 0 0 20px #00ff00;
            border-radius: 10px; z-index: 1; width: 80%; max-width: 400px;
        }
        #scan-result { color: yellow; font-size: 0.8em; margin-top: 15px; height: 50px; overflow: hidden; }
        button {
            background: transparent; color: #00ff00; border: 1px solid #00ff00;
            padding: 10px 20px; font-weight: bold; cursor: pointer; margin: 5px;
            transition: 0.3s;
        }
        button:hover { background: #00ff00; color: black; }
        .glitch { animation: blink 0.2s infinite; color: red; font-weight: bold; display: none; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <canvas id="matrix"></canvas>

    <div class="content">
        <h1 id="typewriter"></h1>
        <p style="color: #00ff00;">STATUS: <span id="status">ENCRYPTED</span></p>
        <div id="scan-result"></div>
        <p id="access-text" class="glitch">ACCESS GRANTED</p>
        
        <button onclick="startScan()">MULAI SCAN</button>
        <button onclick="playAccess()">TES KONEKSI</button>
    </div>

    <audio id="beep" src="https://www.soundjay.com/communication/sounds/beep-07.mp3"></audio>
    <audio id="denied" src="https://www.soundjay.com/communication/sounds/beep-09.mp3"></audio>

    <script>
        // Matrix Background
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        const letters = "0101010101010101";
        const fontSize = 16; const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function draw() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#0f0"; ctx.font = fontSize + "px arial";
            drops.forEach((y, i) => {
                const text = letters.charAt(Math.floor(Math.random() * letters.length));
                ctx.fillText(text, i * fontSize, y * fontSize);
                if (y * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            });
        }
        setInterval(draw, 33);

        // Fitur 1: Typewriter
        const text = "[ USER: EDWARD ]";
        let i = 0;
        function typeWriter() {
            if (i < text.length) {
                document.getElementById("typewriter").innerHTML += text.charAt(i);
                i++; setTimeout(typeWriter, 150);
            }
        }
        window.onload = typeWriter;

        // Fitur 2 & 3: Scan & Sound
        function startScan() {
            const res = document.getElementById("scan-result");
            const logs = ["Bypassing Firewall...", "Searching Database...", "IP Found: 192.168.1.1", "Decrypting Files...", "Success!"];
            let j = 0;
            res.innerHTML = "";
            const interval = setInterval(() => {
                res.innerHTML = logs[j];
                document.getElementById("beep").play();
                j++;
                if(j >= logs.length) clearInterval(interval);
            }, 800);
        }

        function playAccess() {
            document.getElementById("status").innerHTML = "ONLINE";
            document.getElementById("status").style.color = "cyan";
            document.getElementById("access-text").style.display = "block";
            document.getElementById("beep").play();
            setTimeout(() => { document.getElementById("access-text").style.display = "none"; }, 3000);
        }
    </script>
</body>
</html>
