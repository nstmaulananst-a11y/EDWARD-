<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edward.EXE | Ultimate</title>
    <style>
        body { margin: 0; padding: 0; background: black; overflow: hidden; font-family: 'Courier New', Courier, monospace; }
        canvas { display: block; position: fixed; top: 0; left: 0; z-index: -1; }
        
        /* MENU UTAMA */
        .content { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #00ff00; text-align: center; background: rgba(0, 0, 0, 0.9); padding: 20px; border: 2px solid #00ff00; box-shadow: 0 0 20px #00ff00; border-radius: 10px; width: 85%; max-width: 400px; z-index: 10; }
        .game-menu { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        button { background: transparent; color: #00ff00; border: 1px solid #00ff00; padding: 12px 5px; font-weight: bold; cursor: pointer; text-transform: uppercase; }

        /* TERMINAL HECKER SOLID */
        #terminal-overlay { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: black; z-index: 999; padding: 20px; box-sizing: border-box; 
            overflow-y: auto; color: #00ff00; font-size: 1em; white-space: pre-wrap; 
        }
        #exit-btn { position: fixed; top: 10px; right: 10px; background: red; color: white; border: none; padding: 8px; font-weight: bold; z-index: 1000; }
        
        /* INPUT RAHASIA BIAR KEYBOARD MUNCUL */
        #hidden-input { position: absolute; opacity: 0; bottom: 0; left: 0; width: 1px; height: 1px; }
    </style>
</head>
<body>

    <canvas id="matrix"></canvas>

    <div class="content" id="main-content">
        <h2>> EDWARD.EXE</h2>
        <div class="game-menu">
            <button onclick="openTerminal()">TERMINAL EXPLOIT</button>
            <button onclick="location.reload()">LOGOUT</button>
        </div>
    </div>

    <div id="terminal-overlay" onclick="focusInput()">
        <button id="exit-btn" onclick="closeTerminal()">EXIT</button>
        <div id="terminal-text">READY... TYPE ANYTHING!</div>
        <input type="text" id="hidden-input" autocomplete="off" oninput="handleTyping()">
    </div>

    <script>
        // MATRIX BACKGROUND
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        const letters = "01"; const fontSize = 16; const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);
        function draw() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#0f0"; ctx.font = fontSize + "px arial";
            drops.forEach((y, i) => {
                const text = letters.charAt(Math.floor(Math.random() * letters.length));
                ctx.fillText(text, i * fontSize, y * fontSize);
                if (y * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            });
        }
        setInterval(draw, 33);

        const fakeCode = `\n> CONNECTING TO SERVER... \n> BYPASSING SSL... [OK] \n> INJECTING SQL... \n> FETCHING ADMIN_HASH... \n> CRACKING PASSWORD... \n> [SUCCESS] ACCESS GRANTED! \n> git push origin main --force \n> EXPLOIT COMPLETED. \n`;
        let termIdx = 0;

        function openTerminal() {
            document.getElementById("terminal-overlay").style.display = "block";
            focusInput();
        }

        function focusInput() {
            const input = document.getElementById("hidden-input");
            input.focus(); // Paksa keyboard muncul
        }

        function handleTyping() {
            const term = document.getElementById("terminal-text");
            const overlay = document.getElementById("terminal-overlay");
            const input = document.getElementById("hidden-input");

            // Kosongkan input rahasia biar bisa diketik terus
            input.value = "";

            // Munculkan kode palsu
            term.innerHTML += fakeCode.slice(termIdx, termIdx + 5);
            termIdx += 5;
            if (termIdx >= fakeCode.length) termIdx = 0;

            // Getar & Scroll
            if (navigator.vibrate) navigator.vibrate(15);
            overlay.scrollTop = overlay.scrollHeight;
        }

        function closeTerminal() {
            document.getElementById("terminal-overlay").style.display = "none";
            document.getElementById("terminal-text").innerHTML = "READY... TYPE ANYTHING!";
            termIdx = 0;
        }
    </script>
</body>
</html>
